server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       application/javascript application/wasm text/css application/json;

    # The manifest is read with a browser fetch, which the browser would block
    # against studio's origin. Proxying the two small json files keeps the read
    # same origin and leaves studio untouched. updater.json is here for the
    # same reason plus the auto-updaters that still point at this host.
    location = /download/manifest.json {
        proxy_pass        https://gebling-studio.vladas.xyz/blackforge/download/manifest.json;
        proxy_set_header  Host gebling-studio.vladas.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_name    gebling-studio.vladas.xyz;
    }

    location = /download/updater.json {
        proxy_pass        https://gebling-studio.vladas.xyz/blackforge/download/updater.json;
        proxy_set_header  Host gebling-studio.vladas.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_name    gebling-studio.vladas.xyz;
    }

    # Download click reports, blocked cross origin for the same reason.
    location = /api/downloads/track {
        proxy_pass        https://gebling-studio.vladas.xyz/api/downloads/track;
        proxy_set_header  Host gebling-studio.vladas.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_name    gebling-studio.vladas.xyz;
    }

    # Release binaries stay on studio and are never proxied, so no release
    # bytes flow through this container. Desktop builds that have this host
    # baked into their updater endpoint follow the redirect.
    location /download/ {
        return 301 https://gebling-studio.vladas.xyz/blackforge$request_uri;
    }

    # A wrong content type here makes the browser refuse to instantiate the
    # module through the streaming compiler.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri /index.html;
    }
}
