# The mods every profile of a game gets, at the exact version the game servers
# run. The app adds them before every sync and nobody can remove or disable
# them. A mod here goes into the composes of the servers too, at the same
# version.

# The Sailing skill. It refuses a join when the versions of the player and
# the server differ, so the version moves here and in the composes together.
[[games.valheim]]
package = "Smoothbrain-Sailing"
version = "1.1.8"
