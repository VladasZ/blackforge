# The tiers of competitive servers, see docs/competitive.md. Kept by hand.
#
# Each tier is a boss in the order of the game and the global key its death
# sets. `items` lists only what a world cannot give at all before that boss
# dies: the boss drops, a material only a gated tool, station or piece can get,
# and trader stock the trader holds back until the boss dies. A troll hide is
# not listed, anybody can kill a troll. The plugins forbid every item that
# cannot be made without a listed one, through the recipes, the smelters,
# fermenters and cooking stations and the build cost of every station. So the
# artisan table, built from Moder's tear, puts black metal and bread behind
# Moder by itself.
#
# The names are prefab names from the game data of Valheim 1.0.15, the server
# plugin logs any name the game does not know.

[games.valheim]
# Items a recipe would forbid that also drop from mobs, chests or rocks
# anybody can reach.
allow = [
    "ArrowCarapace", "ArrowCharred", "BloodGoldKey", "BoltCharred", "Bread",
    "KnifeVoid", "Lantern", "MeadEitrMinor",
]

[[games.valheim.tiers]]
key = "defeated_eikthyr"
boss = "Eikthyr"
items = ["TrophyEikthyr", "HardAntler"]

[[games.valheim.tiers]]
key = "defeated_gdking"
boss = "The Elder"
# The spice, the vial, the flesh and the stone are trader stock.
items = ["TrophyTheElder", "CryptKey", "SpiceForests", "BlobVial", "YmirRemains", "Thunderstone"]

[[games.valheim.tiers]]
key = "defeated_bonemass"
boss = "Bonemass"
items = ["TrophyBonemass", "Wishbone"]

[[games.valheim.tiers]]
key = "defeated_dragon"
boss = "Moder"
# Yggdrasil wood needs an axe of tier 4, all of them need black metal. Sap
# needs the sap collector, built from Yggdrasil wood and black metal. The rest
# is trader stock.
items = [
    "TrophyDragonQueen", "DragonTear", "YggdrasilWood", "Sap",
    "ScytheHandle", "MushroomBzerker", "FragrantBundle", "SpiceMountains",
]

[[games.valheim.tiers]]
key = "defeated_goblinking"
boss = "Yagluth"
# A wisp comes only from the wisp lure, built from the torn spirit.
items = ["TrophyGoblinKing", "YagluthDrop", "Wisp", "SpicePlains"]

[[games.valheim.tiers]]
key = "defeated_queen"
boss = "The Queen"
items = ["TrophySeekerQueen", "QueenDrop", "SpiceMistlands"]

[[games.valheim.tiers]]
key = "defeated_fader"
boss = "Fader"
items = ["TrophyFader", "FaderDrop", "SpiceAshlands"]

[[games.valheim.tiers]]
key = "defeated_frozenking_p3"
boss = "Kall Fimbulbringer"
items = ["FrozenKingDrop", "CrownJewel", "SpiceDeepNorth"]
