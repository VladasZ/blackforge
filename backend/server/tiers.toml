# The tiers of competitive servers, see docs/competitive.md. Kept by hand.
#
# Each tier is a boss in the order of the game, the global key its death sets,
# and the materials of the biome it unlocks. A player may not bring an item of
# a tier whose boss the world has not killed. The plugins also forbid every
# item made from a listed material, through the recipes, smelters, fermenters
# and cooking stations of the game, so only raw materials, boss drops and
# trophies are listed. The names are prefab names from the game data, the
# server plugin logs any name the game does not know.

