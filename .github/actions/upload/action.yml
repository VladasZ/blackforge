name: upload
description: Copies every versioned file in dist/ to the download host over Tailscale.

inputs:
  host:
    required: true
  dl-dir:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
        for f in dist/blackforge-$VERSION-*; do
          scp $SSH_OPTS "$f" vladas@${{ inputs.host }}:${{ inputs.dl-dir }}/
        done
