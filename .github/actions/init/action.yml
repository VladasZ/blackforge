name: init
description: >
  Installs rustscript and checks out the build submodule. The submodule url in
  .gitmodules is ssh, and an ssh fetch needs a GitHub key that a runner does
  not have. hilen/build is public, so the url is rewritten to https for this
  one command and the fetch needs no token.

runs:
  using: composite
  steps:
    - uses: VladasZ/rustscript@v0.1
    - shell: bash
      run: |
        set -euo pipefail
        git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive
