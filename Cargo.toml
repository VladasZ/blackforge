[workspace]
default-members = ["crates/blackforge"]
members = ["backend/server", "crates/blackforge", "crates/blackforge-api", "crates/blackforge-cli", "crates/blackforge-core", "web"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hilen/blackforge"
version = "0.1.28"

[workspace.dependencies]
chrono = "0.4"
gethostname = "1.1"
getrandom = "0.4"
plat = "0.9"
web-sys = { version = "0.3", features = ["Location", "Window"] }
winresource = "0.1"
blackforge-api = { path = "crates/blackforge-api", version = "0.1.0" }
blackforge-core = { path = "crates/blackforge-core", version = "0.1.0" }

anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
constant_time_eq = "0.6"
dirs = "7.0"
dotenvy = "0.15"
flate2 = "1.1"
futures-util = "0.3"
hilen = { git = "https://github.com/hilen/hilen", rev = "2389d3efcf383998ea32068d0ff9ff7837a1793a" }
hilen-server = { git = "https://github.com/hilen/hilen", rev = "2389d3efcf383998ea32068d0ff9ff7837a1793a" }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
indicatif = "0.18"
log = "0.4"
noise = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "stream",
] }
regex = "1.13"
rust-embed = "8.12"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
# The same version and features as `hilen-server`, its `migrate!` macro expands
# to `::sqlx` paths and needs the crate by that name here.
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "uuid",
] }
steamlocate = "2.1"
tempfile = "3.27"
thiserror = "2.0"
tiny_http = "0.12"
timeago = { version = "0.6", default-features = false }
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

explicit_deref_methods = "allow"
format_push_string = "allow"
inline_always = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
unnecessary_box_returns = "allow"

# The ground of the landing page is painted with it at every start. Left
# unoptimized, that second of noise math is felt on each debug run.
[profile.dev.package.noise]
opt-level = 3
