[workspace]
default-members = ["crates/blackforge"]
members = ["crates/blackforge", "crates/blackforge-cli", "crates/blackforge-core", "web"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hilen/blackforge"
version = "0.1.1"

[workspace.dependencies]
chrono = "0.4"
plat = "0.9"
web-sys = { version = "0.3", features = ["Location", "Window"] }
winresource = "0.1"
blackforge-core = { path = "crates/blackforge-core", version = "0.1.0" }

anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
flate2 = "1.1"
futures-util = "0.3"
hilen = { git = "https://github.com/hilen/hilen", rev = "43c0f263759cd905e1718052be3761f95ea60b62" }
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.18"
log = "0.4"
noise = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
steamlocate = "2.1"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
] }
toml = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

explicit_deref_methods = "allow"
format_push_string = "allow"
inline_always = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
unnecessary_box_returns = "allow"

# The ground of the landing page is painted with it at every start. Left
# unoptimized, that second of noise math is felt on each debug run.
[profile.dev.package.noise]
opt-level = 3
